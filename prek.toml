# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" }
]

[[repos]]
repo = "https://github.com/pre-commit/mirrors-mypy"
rev = "v2.4.1"
hooks = [
  {
    id = "mypy",
    additional_dependencies = [
      "argon2-cffi",
      "asyncpg",
      "camel-converter[pydantic]",
      "faker",
      "fastapi",
      "meilisearch-python-sdk",
      "passlib",
      "polars",
      "pydantic",
      "pydantic-settings",
      "pyjwt",
      "python-dotenv",
      "rich",
      "srsly",
      "typer",
      "uvicorn[standard]"
    ],
    exclude = '.*/test_.*\.py|.*/conftest\.py|src/rest_api_postgres/python/.*|src/pyp3_mock_data/.*|src/pyo3_mock_data/.*',
    args = ["--explicit-package-bases"] # mono repo layout
  },
  {
    id = "mypy",
    alias = "mypy-rest-api-postgres",
    pass_filenames = false,
    files = "^src/rest_api_postgres/python/",
    additional_dependencies = [
      "asyncpg",
      "camel-converter[pydantic]",
      "fastapi",
      "pydantic",
      "pydantic-settings",
      "uvicorn[standard]"
    ],
    entry = """bash -c 'cd src/rest_api_postgres/python && mypy -p app "$@"' --"""
  },
  {
    id = "mypy",
    alias = "mypy-pyo3-mock-data",
    pass_filenames = false,
    files = "^src/pyo3_mock_data/",
    entry = """bash -c 'cd src/pyo3_mock_data && mypy -p pyo3_mock_data "$@"' --"""
  }
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.5"
hooks = [
  { id = "ruff-check", args = ["--fix", "--exit-non-zero-on-fix"] },
  { id = "ruff-format" }
]

[[repos]]
repo = "local"
hooks = [
  { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt --all", language = "system", types = ["rust"], pass_filenames = false }
]
