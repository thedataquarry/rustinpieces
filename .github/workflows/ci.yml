name: Linting and Testing

on:
  push:
    branches:
      - main
  pull_request:
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  POSTGRES_PASSWORD: "test_password"
  DATABASE_URL: "postgresql://postgres:test_password@127.0.0.1:5432/testing"
jobs:
  prek:
    name: Prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust # Reads rust-toolchain.toml; needed by the cargo fmt hook
        run: rustup toolchain install
      - uses: j178/prek-action@v3.1.1
        with:
          prek-version: "0.5.11"
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Prep data and sqlx # This prevents sqlx errors if the database isn't running
        run: sh ./ci/prep_tests.sh
      - name: Run cargo clippy
        run: cargo clippy --all-targets -- --deny warnings
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Prep data and sqlx # This prevents sqlx errors if the database isn't running
        run: sh ./ci/prep_tests.sh
      - name: Run cargo test
        run: cargo test
