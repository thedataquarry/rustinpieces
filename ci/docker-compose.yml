services:
  database:
    image: "postgres:18"
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./pg/:/var/lib/postgresql/
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.57
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=apiKey
      - MEILI_NO_ANALYTICS=true
